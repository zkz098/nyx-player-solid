<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NyxPlayer Solid — 演示</title>
    <link rel="stylesheet" href="./nyx-player.css" />
    <style>
      body {
        margin: 0;
        min-height: 90vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f5f6f8;
        color: #444;
      }
      .demo-bar {
        display: flex;
        gap: 1rem;
      }
      button {
        padding: 0.5rem 1.25rem;
        border: 1px solid #ccc;
        border-radius: 999px;
        background: #fff;
        cursor: pointer;
        font-size: 0.9rem;
        transition: border-color 0.15s;
      }
      button:hover {
        border-color: #666;
      }
      .hint {
        font-size: 0.8rem;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <button id="show" type="button">显示 / 隐藏播放器</button>
      <button id="play" type="button">播放 / 暂停</button>
    </div>
    <p class="hint">演示使用公共示例音频；无网络时界面仍可用。</p>
    <div id="app"></div>

    <script src="./sources.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
